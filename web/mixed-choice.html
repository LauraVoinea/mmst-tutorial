/* Text: text/mixed-choice.md. The two runs: parts/two-runs.html and sides.js. */
body{height:auto; min-height:100vh}
.doc dl{margin:.3rem 0 1.2rem}
.doc dt{font-family:var(--mono); font-size:.86rem; color:var(--ink); margin:1rem 0 0}
.doc dt span{font-family:var(--sans); font-size:.96rem; color:var(--ink-2); margin-left:.55rem}
.doc dd{margin:.25rem 0 0; color:var(--ink-2)}
.doc .cite{font-size:.86rem; color:var(--ink-3); line-height:1.7}
.doc p.back a{font-family:var(--mono); font-size:.8rem; color:var(--accent)}
.doc ul.reading{list-style:none; margin:0 0 1.4rem; padding:0; max-width:44rem}

<header id="site-header"></header>

<main class="doc">
  <div class="col" data-md="text/mixed-choice.md" data-doc></div>
</main>

<footer class="site" id="site-footer"></footer>

<script>
// The four checks, from shared.js, with links to their definitions in the paper.
window.MMST.ready.then(function(){
  "use strict";
  var A = "https://arxiv.org/html/2602.23927v2#";
  function a(id, text){ return '<a href="' + A + id + '">' + text + "</a>"; }
  var AWARE = "<b>awareness</b>: " + a("S3.Thmtheorem9", "Definition 3.9") + ", " + a("S3.SS3", "§3.3");
  var REFS = {
    WF: a("S3.Thmtheorem4", "Definition 3.4") + ", " + a("S3.SS1", "§3.1"),
    SD: "with CT, " + AWARE,
    CT: "with SD, " + AWARE,
    BA: a("S3.Thmtheorem12", "Definition 3.12") + ", " + a("S3.SS3", "§3.3")
  };
  var slot = document.querySelector(".checks"), C = window.MMST.checks, h = "<dl>";
  if (!slot) return;
  window.MMST.order.forEach(function(k){
    h += "<dt>" + k + "<span>" + C[k][0] + "</span></dt><dd>" + C[k][1].replace(/\.$/, "") + " (" + REFS[k] + ").</dd>";
  });
  slot.innerHTML = h + "</dl>";
});
</script>
</body>
